<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4f57" />
    <title>Offline · Dosar medical</title>
    <style>
      :root {
        color-scheme: light;
        --fg: #142428;
        --muted: #5a6b70;
        --bg: #f4f8f8;
        --card: #ffffff;
        --accent: #1f4f57;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        width: min(100%, 22rem);
        padding: 1.5rem;
        border-radius: 1rem;
        background: var(--card);
        border: 1px solid #d5e0e2;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.45;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ești offline</h1>
      <p>
        Dosarul medical are nevoie de internet ca să citească datele și
        documentele. Reîncearcă când ai conexiune.
      </p>
      <button type="button" onclick="location.reload()">Reîncearcă</button>
    </main>
  </body>
</html>
